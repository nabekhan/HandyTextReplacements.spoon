name: Release Spoon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4

      - name: Test replacement engine
        run: |
          lua5.4 - <<'LUA'
          local engine = dofile("engine.lua")
          local ok, failures = engine.runTests()
          if not ok then
              for _, failure in ipairs(failures) do
                  io.stderr:write(string.format(
                      "%s: expected %q, got %q\n",
                      failure.name,
                      failure.expected,
                      failure.actual
                  ))
              end
              os.exit(1)
          end
          LUA

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          spoon_version=$(sed -n 's/^obj\.version = "\([^"]*\)"$/\1/p' init.lua)
          test "$RELEASE_TAG" = "v$spoon_version"

      - name: Package Spoon
        run: |
          package_name="HandyTextReplacements.spoon"
          archive_name="$package_name.zip"

          mkdir -p "dist/$package_name"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='dist/' \
            --exclude='*.zip' \
            ./ "dist/$package_name/"

          cd dist
          zip -r -q "$archive_name" "$package_name"
          sha256sum "$archive_name" > "$archive_name.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="dist/HandyTextReplacements.spoon.zip"
          checksum="$archive.sha256"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$archive" \
              "$checksum" \
              --verify-tag \
              --generate-notes \
              --title "HandyTextReplacements $RELEASE_TAG"
          fi
